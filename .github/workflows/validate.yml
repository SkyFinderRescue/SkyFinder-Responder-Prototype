name: Validate responder prototype

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check JavaScript syntax
        run: |
          node --check app.mjs
          node --check core.mjs
          node --check firebase-backend.mjs
          node --check firebase-config.js
          node --check mock-backend.mjs
          node --check paddler-feed/app.js
          node --check paddler-feed/drift/app.js
      - name: Run responder core tests
        run: node --test tests/core.test.mjs
      - name: Run Garmin paddler collector tests
        run: python -m unittest discover -s paddler-feed/tests -v
      - name: Validate paddler field-test registry consent rules
        run: python paddler-feed/validate_registry.py paddler-feed/registry.json
      - name: Guard production separation
        run: |
          test ! -e scripts/build_live_snapshot.py
          test ! -e data-live
          grep -q "NOT connected to production SkyFinder" README.md
