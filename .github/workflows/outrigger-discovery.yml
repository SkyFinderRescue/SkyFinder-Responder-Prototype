name: Outrigger World Paddler Discovery

on:
  push:
    branches:
      - prototype/paddler-source-discovery-v2
    paths:
      - "paddler-feed/discover_outrigger_world.py"
      - ".github/workflows/outrigger-discovery.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[outrigger-bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile check
        run: python -m py_compile paddler-feed/discover_outrigger_world.py
      - name: Crawl public Southern California results
        run: |
          python paddler-feed/discover_outrigger_world.py \
            --output paddler-feed/data/outrigger-world-paddlers.json \
            --timeout 20 --sleep 0.03
      - name: Validate output and privacy
        run: |
          python - <<'PY'
          import json
          p='paddler-feed/data/outrigger-world-paddlers.json'
          d=json.load(open(p)); s=d['summary']
          assert s['listing_http_status']==200, s
          assert s['unique_paddlers']>=1, s
          raw=open(p,encoding='utf-8').read().lower()
          for forbidden in ['"email"','"phone"','"lat"','"lng"','imei']:
              assert forbidden not in raw, forbidden
          print(json.dumps(s,indent=2))
          PY
      - name: Publish index
        run: |
          git config user.name "skyfinder-outrigger-bot"
          git config user.email "actions@users.noreply.github.com"
          git add paddler-feed/data/outrigger-world-paddlers.json
          if git diff --cached --quiet; then echo "No change"; else
            git commit -m "Update Outrigger World public paddler index [outrigger-bot]"
            git push
          fi
