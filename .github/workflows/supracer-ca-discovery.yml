name: SUP Racer California Archive Discovery

on:
  push:
    branches:
      - prototype/paddler-source-discovery-v2
    paths:
      - "paddler-feed/discover_supracer_ca.py"
      - ".github/workflows/supracer-ca-discovery.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[supracer-bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile paddler-feed/discover_supracer_ca.py
      - name: Crawl public California SUP Racer result archive
        run: |
          python paddler-feed/discover_supracer_ca.py \
            --output paddler-feed/data/supracer-ca-paddlers.json \
            --timeout 20 --sleep 0.02 --max-events 300
      - name: Validate index/privacy
        run: |
          python - <<'PY'
          import json
          p='paddler-feed/data/supracer-ca-paddlers.json';d=json.load(open(p));s=d['summary']
          assert s['index_http_status']==200,s
          assert s['unique_paddlers']>=1,s
          raw=open(p,encoding='utf-8').read().lower()
          for forbidden in ['"email"','"phone"','imei','"lat"','"lng"']:
              assert forbidden not in raw,forbidden
          print(json.dumps(s,indent=2))
          PY
      - name: Publish index
        run: |
          git config user.name "skyfinder-supracer-bot"
          git config user.email "actions@users.noreply.github.com"
          git add paddler-feed/data/supracer-ca-paddlers.json
          if git diff --cached --quiet; then echo "No change"; else
            git commit -m "Update SUP Racer California public archive index [supracer-bot]"
            git push
          fi
