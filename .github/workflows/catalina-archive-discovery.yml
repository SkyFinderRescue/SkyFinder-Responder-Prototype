name: Catalina Classic Archive Discovery

on:
  push:
    branches:
      - prototype/paddler-source-discovery-v2
    paths:
      - "paddler-feed/discover_catalina_archive.py"
      - ".github/workflows/catalina-archive-discovery.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[catalina-bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF text parser
        run: python -m pip install --disable-pip-version-check pypdf
      - name: Compile check
        run: python -m py_compile paddler-feed/discover_catalina_archive.py
      - name: Crawl public Catalina Classic archive
        run: |
          python paddler-feed/discover_catalina_archive.py \
            --output paddler-feed/data/catalina-classic-archive.json \
            --timeout 20 --sleep 0.02 --max-docs 300
      - name: Validate public index
        run: |
          python - <<'PY'
          import json
          p='paddler-feed/data/catalina-classic-archive.json'
          d=json.load(open(p)); s=d['summary']
          assert s['documents_http_200'] >= 10, s
          assert s['unique_candidate_paddlers'] >= 1, s
          raw=open(p,encoding='utf-8').read().lower()
          for forbidden in ['"email"','"phone"','imei','"lat"','"lng"']:
              assert forbidden not in raw, forbidden
          print(json.dumps(s,indent=2))
          PY
      - name: Publish archive index
        run: |
          git config user.name "skyfinder-catalina-bot"
          git config user.email "actions@users.noreply.github.com"
          git add paddler-feed/data/catalina-classic-archive.json
          if git diff --cached --quiet; then echo "No change"; else
            git commit -m "Update Catalina Classic public archive index [catalina-bot]"
            git push
          fi
