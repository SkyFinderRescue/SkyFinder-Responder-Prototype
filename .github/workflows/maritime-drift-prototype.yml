name: Maritime Drift Prototype Snapshot

on:
  push:
    branches:
      - main
    paths:
      - "paddler-feed/drift/**"
      - ".github/workflows/maritime-drift-prototype.yml"
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: write

concurrency:
  group: maritime-drift-prototype-main
  cancel-in-progress: false

jobs:
  validate-live-data-and-model:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[drift-env-bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile and unit test drift engine
        working-directory: paddler-feed/drift
        run: |
          python -m py_compile engine.py fetch_environment.py test_engine.py
          python -m unittest -v test_engine.py

      - name: Fetch Santa Barbara prototype environmental snapshot
        run: |
          python paddler-feed/drift/fetch_environment.py \
            --lat 34.246 --lon -119.842 \
            --output paddler-feed/drift/environment-latest.json \
            --timeout 30

      - name: Validate source freshness without fabricating missing current data
        id: envcheck
        run: |
          python - <<'PY'
          import json, os
          p='paddler-feed/drift/environment-latest.json'
          d=json.load(open(p)); h=d['surface_current']; w=d['wind_wave']
          wind_ok=bool(w.get('usable')) and float(w.get('age_hours',999)) <= 3
          current_ok=bool(h.get('usable')) and float(h.get('age_hours',999)) <= 6
          can_run=wind_ok and current_ok
          d['drift_model_ready']=can_run
          d['drift_model_status']='READY' if can_run else 'DEGRADED_ENVIRONMENT_SOURCE'
          if not current_ok:
              d['drift_model_block_reason']='Fresh usable surface-current vector unavailable; no new drift estimate generated.'
          elif not wind_ok:
              d['drift_model_block_reason']='Fresh usable wind observation unavailable; no new drift estimate generated.'
          else:
              d.pop('drift_model_block_reason',None)
          with open(p,'w') as f: json.dump(d,f,indent=2); f.write('\n')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f"can_run={'true' if can_run else 'false'}\n")
          print(json.dumps({'surface_current':h,'wind_wave':w,'drift_model_ready':can_run},indent=2))
          if not can_run:
              print('Environmental snapshot is degraded. Publishing source status, but intentionally skipping the drift estimate rather than using stale or invented current data.')
          PY

      - name: Run 2-hour Coast Guard leeway example
        if: steps.envcheck.outputs.can_run == 'true'
        run: |
          python paddler-feed/drift/engine.py \
            --environment paddler-feed/drift/environment-latest.json \
            --object sea_kayak_person \
            --hours 2 --particles 3000 \
            --output paddler-feed/drift/drift-example.json

      - name: Validate drift output safety boundary
        if: steps.envcheck.outputs.can_run == 'true'
        run: |
          python - <<'PY'
          import json
          d=json.load(open('paddler-feed/drift/drift-example.json'))
          assert d['operational_use'] is False
          assert d['object']['source_match']=='direct'
          assert d['method']['step_minutes']==20
          assert len(d['estimate']['probability_50_polygon']) >= 4
          assert len(d['estimate']['probability_90_polygon']) >= 4
          PY

      - name: Publish refreshed snapshot safely
        env:
          CAN_RUN: ${{ steps.envcheck.outputs.can_run }}
        run: |
          git config user.name "skyfinder-drift-env-bot"
          git config user.email "actions@users.noreply.github.com"
          git add paddler-feed/drift/environment-latest.json
          if [ "$CAN_RUN" = "true" ]; then
            git add paddler-feed/drift/drift-example.json
          fi
          if git diff --cached --quiet; then
            echo "No drift snapshot change."
            exit 0
          fi
          git commit -m "Update maritime drift source snapshot [drift-env-bot]"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 3))
          done
          echo "Failed to publish drift snapshot after retries" >&2
          exit 1
