name: Misc California Paddle Archive Discovery

on:
  push:
    branches:
      - prototype/paddler-source-discovery-v2
    paths:
      - "paddler-feed/discover_misc_ca_archives.py"
      - "paddler-feed/misc-ca-archive-sources.json"
      - ".github/workflows/misc-ca-archive-discovery.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[misc-archive-bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pypdf
      - run: python -m py_compile paddler-feed/discover_misc_ca_archives.py
      - name: Crawl independent California public archives
        run: |
          python paddler-feed/discover_misc_ca_archives.py \
            --sources paddler-feed/misc-ca-archive-sources.json \
            --output paddler-feed/data/misc-ca-archive-paddlers.json \
            --timeout 20 --sleep 0.02 --max-linked 100
      - name: Validate index/privacy
        run: |
          python - <<'PY'
          import json
          p='paddler-feed/data/misc-ca-archive-paddlers.json';d=json.load(open(p));s=d['summary']
          assert s['documents_http_200']>=3,s
          assert s['unique_paddlers']>=1,s
          raw=open(p,encoding='utf-8').read().lower()
          for forbidden in ['"email"','"phone"','imei','"lat"','"lng"']:
              assert forbidden not in raw,forbidden
          print(json.dumps(s,indent=2))
          PY
      - name: Publish index
        run: |
          git config user.name "skyfinder-misc-archive-bot"
          git config user.email "actions@users.noreply.github.com"
          git add paddler-feed/data/misc-ca-archive-paddlers.json
          if git diff --cached --quiet; then echo "No change"; else
            git commit -m "Update independent California paddle archive index [misc-archive-bot]"
            git push
          fi
