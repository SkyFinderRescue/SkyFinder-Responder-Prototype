name: PaddleSplash Public Result Discovery

on:
  push:
    branches:
      - prototype/paddler-source-discovery-v2
    paths:
      - "paddler-feed/discover_paddlesplash.py"
      - ".github/workflows/paddlesplash-discovery.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[paddlesplash-bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m py_compile paddler-feed/discover_paddlesplash.py
      - run: python paddler-feed/discover_paddlesplash.py --output paddler-feed/data/paddlesplash-paddlers.json --timeout 20
      - name: Validate
        run: |
          python - <<'PY'
          import json
          p='paddler-feed/data/paddlesplash-paddlers.json';d=json.load(open(p));s=d['summary']
          assert s['years_checked']==4,s
          assert s['unique_paddlers']>=1,s
          raw=open(p,encoding='utf-8').read().lower()
          for x in ['"email"','"phone"','"lat"','"lng"','imei']: assert x not in raw,x
          print(json.dumps(s,indent=2))
          PY
      - name: Publish safely
        run: |
          git config user.name "skyfinder-paddlesplash-bot"; git config user.email "actions@users.noreply.github.com"
          git add paddler-feed/data/paddlesplash-paddlers.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update PaddleSplash public result index [paddlesplash-bot]"
          for n in 1 2 3; do
            git fetch origin prototype/paddler-source-discovery-v2
            if git rebase origin/prototype/paddler-source-discovery-v2 && git push origin HEAD:prototype/paddler-source-discovery-v2; then exit 0; fi
            git rebase --abort || true; sleep $((n*3))
          done
          exit 1
