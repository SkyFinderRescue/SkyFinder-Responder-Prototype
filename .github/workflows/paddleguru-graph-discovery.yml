name: PaddleGuru California Graph Discovery

on:
  push:
    branches:
      - prototype/paddler-source-discovery-v2
    paths:
      - "paddler-feed/expand_paddleguru_graph.py"
      - "paddler-feed/paddleguru-graph-seeds.json"
      - ".github/workflows/paddleguru-graph-discovery.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paddleguru-california-graph
  cancel-in-progress: true

jobs:
  graph-discovery:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[paddleguru-graph-bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype/paddler-source-discovery-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile-check
        run: python -m py_compile paddler-feed/expand_paddleguru_graph.py paddler-feed/discover_public_sources.py

      - name: Crawl public California PaddleGuru athlete-event graph
        run: |
          python paddler-feed/expand_paddleguru_graph.py \
            --seeds paddler-feed/paddleguru-graph-seeds.json \
            --prior-index paddler-feed/data/discovered-paddlers.json \
            --output paddler-feed/data/paddleguru-graph.json \
            --timeout 20 \
            --sleep 0.015 \
            --max-athlete-pages 1200 \
            --max-events 1200 \
            --rounds 5

      - name: Validate privacy and useful California coverage
        run: |
          python - <<'PY'
          import json
          p='paddler-feed/data/paddleguru-graph.json'
          d=json.load(open(p)); s=d['summary']
          assert s['athlete_history_handles_crawled'] >= 250, s
          assert s['event_slugs_discovered'] >= 20, s
          assert s['unique_paddlers_with_california_event'] >= 1, s
          forbidden={'email','phone','street','imei','lat','lng','latitude','longitude'}
          def walk(x):
              if isinstance(x,dict):
                  for k,v in x.items():
                      assert str(k).lower() not in forbidden, k
                      walk(v)
              elif isinstance(x,list):
                  for v in x: walk(v)
          walk(d)
          print(json.dumps(s, indent=2))
          print(json.dumps({'rounds':d.get('rounds',[])}, indent=2))
          PY

      - name: Publish graph index safely
        run: |
          git config user.name "skyfinder-paddleguru-graph-bot"
          git config user.email "actions@users.noreply.github.com"
          git add paddler-feed/data/paddleguru-graph.json
          if git diff --cached --quiet; then
            echo "No graph-index change."
            exit 0
          fi
          git commit -m "Update PaddleGuru California graph [paddleguru-graph-bot]"
          for attempt in 1 2 3; do
            git fetch origin prototype/paddler-source-discovery-v2
            if git rebase origin/prototype/paddler-source-discovery-v2 && git push origin HEAD:prototype/paddler-source-discovery-v2; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 3))
          done
          exit 1
